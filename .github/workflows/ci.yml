name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.env.example'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.env.example'

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Build & deploy (Mac mini)
    needs: [changes, backend, frontend]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    # Runs on a self-hosted runner installed on the Mac mini.
    # Register it with: ./config.sh --labels macmini (see README)
    runs-on: [self-hosted, macmini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Rebuild .env from GitHub Secrets on every run. The default checkout
      # `git clean` removes untracked files, so a hand-written .env would be
      # wiped between deploys. Any secret not configured falls back to the
      # defaults baked into docker-compose.yml.
      - name: Prepare .env from secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ROOT_USERNAME: ${{ secrets.ROOT_USERNAME }}
          ROOT_EMAIL: ${{ secrets.ROOT_EMAIL }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          : > .env
          [ -n "$POSTGRES_USER" ] && echo "POSTGRES_USER=$POSTGRES_USER" >> .env || true
          [ -n "$POSTGRES_PASSWORD" ] && echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env || true
          [ -n "$POSTGRES_DB" ] && echo "POSTGRES_DB=$POSTGRES_DB" >> .env || true
          [ -n "$JWT_SECRET_KEY" ] && echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> .env || true
          [ -n "$ROOT_USERNAME" ] && echo "ROOT_USERNAME=$ROOT_USERNAME" >> .env || true
          [ -n "$ROOT_EMAIL" ] && echo "ROOT_EMAIL=$ROOT_EMAIL" >> .env || true
          [ -n "$ROOT_PASSWORD" ] && echo "ROOT_PASSWORD=$ROOT_PASSWORD" >> .env || true
          [ -n "$AUTH_SECRET" ] && echo "AUTH_SECRET=$AUTH_SECRET" >> .env || true
          if [ -z "$JWT_SECRET_KEY" ] || [ -z "$AUTH_SECRET" ]; then
            echo "::warning::JWT_SECRET_KEY and/or AUTH_SECRET not set; using insecure defaults."
          fi

      # Backend is deployed first so it is always up before the frontend.
      - name: Build backend image
        if: needs.changes.outputs.backend == 'true'
        run: docker compose build --pull backend

      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: docker compose up -d backend

      - name: Build frontend image
        if: needs.changes.outputs.frontend == 'true'
        run: docker compose build --pull frontend

      - name: Deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        run: docker compose up -d frontend

      - name: Prune dangling images
        run: docker image prune -f
