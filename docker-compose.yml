services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maxerp}:${POSTGRES_PASSWORD:-maxerp}@host.docker.internal:5432/${POSTGRES_DB:-maxerp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      ROOT_USERNAME: ${ROOT_USERNAME:-root}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@maxerp.com}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-root12345}
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-secret}
      AUTH_TRUST_HOST: "true"
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
